<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#04060b">
<title>MeteoND</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* Pantalla única tipo Navigation Display: mapa track-up a pantalla completa,
   HUD en las esquinas, rosa de rumbos centrada en el avión propio, botonera abajo. */
:root{
  --bg:#04060b;
  --ink:#eef2f7;          /* blanco ND: cifras y símbolo propio */
  --dim:rgba(238,242,247,.55);
  --green:#46e070;        /* etiquetas fijas */
  --cyan:#3ad8ea;         /* selección y datos de capa */
  --magenta:#ff62d4;      /* rumbo seleccionado / línea de track */
  --amber:#ffb22e;        /* avisos */
  --panel:rgba(4,6,11,.62);
  --font:"B612 Mono","DejaVu Sans Mono",ui-monospace,Menlo,Consolas,monospace;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);
  --sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none;touch-action:none}
#map,#wind,#rose{position:fixed;inset:0}
#map{background:var(--bg)}
#wind,#rose{pointer-events:none}
.maplibregl-canvas{outline:none}

/* --- HUD --- */
.hud{position:fixed;pointer-events:none;text-shadow:0 0 3px #000,0 0 6px #000;line-height:1.15}
.g{color:var(--green)} .c{color:var(--cyan)} .a{color:var(--amber)} .m{color:var(--magenta)}
.sm{font-size:12px;letter-spacing:.06em}

#tl{top:calc(var(--st) + 10px);left:max(12px,var(--sl));font-size:18px}
#tl .row{display:flex;align-items:baseline;gap:7px;min-height:22px}
#windarrow{display:inline-block;width:18px;height:18px;vertical-align:-3px}

#trk{top:calc(var(--st) + 8px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;font-size:15px}
#trk .box{font-size:24px;font-weight:700;color:var(--ink);border:1.5px solid var(--ink);border-top:none;
  padding:0 8px 1px;min-width:62px;text-align:center}

#tr{top:calc(var(--st) + 10px);right:max(12px,var(--sr));text-align:right;font-size:16px}
#tr .age{font-size:12px}

#ann{top:calc(var(--st) + 74px);left:max(12px,var(--sl));font-size:13px;letter-spacing:.08em;
  color:var(--amber);border:1.5px solid var(--amber);padding:2px 6px;background:var(--panel)}

#legend{right:max(10px,var(--sr));top:52%;display:flex;gap:6px;align-items:stretch;font-size:11px;
  background:var(--panel);padding:8px 8px 8px 6px;border:1px solid rgba(238,242,247,.18)}
#legend .labels{display:flex;flex-direction:column;justify-content:space-between;text-align:right;color:var(--ink)}
#legend .bar{width:9px;border:1px solid rgba(238,242,247,.35)}
#legend .ttl{writing-mode:vertical-rl;transform:rotate(180deg);color:var(--green);letter-spacing:.1em;font-size:11px;text-align:center}

/* --- Botonera --- */
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;
  padding:10px max(12px,var(--sr)) calc(var(--sb) + 12px) max(12px,var(--sl));
  background:linear-gradient(to top,rgba(4,6,11,.92) 55%,rgba(4,6,11,0))}
#bar button{font:700 15px/1 var(--font);letter-spacing:.12em;color:var(--green);background:rgba(4,6,11,.75);
  border:1.5px solid rgba(70,224,112,.35);padding:13px 0;flex:1;max-width:130px;cursor:pointer}
#bar button[aria-pressed="true"]{color:var(--cyan);border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
#bar button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.maplibregl-ctrl-bottom-right{bottom:calc(var(--sb) + 64px)!important;right:var(--sr)}
.maplibregl-ctrl-attrib{background:rgba(4,6,11,.7)!important;color:var(--dim);font:10px var(--font)}
.maplibregl-ctrl-attrib a{color:var(--dim)}
.maplibregl-ctrl-attrib-button{filter:invert(1)}
@media (prefers-reduced-motion:reduce){#bar button{transition:none}}
</style>
</head>
<body>
<div id="map"></div>
<canvas id="wind"></canvas>
<svg id="rose" xmlns="http://www.w3.org/2000/svg"></svg>

<div class="hud" id="tl">
  <div class="row"><span class="g sm">GS</span><span id="gs">---</span><span class="g sm">KM/H</span></div>
  <div class="row" id="windrow" hidden><svg id="windarrow" viewBox="-10 -10 20 20"><path d="M0-8V7M-4 3L0 8 4 3" stroke="#eef2f7" stroke-width="1.8" fill="none"/></svg><span id="wnd">---°/--</span></div>
  <div class="row" id="satrow" hidden><span class="g sm">SAT</span><span id="sat">--</span><span class="g sm">°C</span></div>
</div>

<div class="hud" id="trk"><span class="g">TRK</span><span class="box" id="trkv">---</span><span class="g">TRU</span></div>

<div class="hud" id="tr">
  <div class="c" id="lyr">—</div>
  <div class="c" id="lyrt"></div>
  <div class="age" id="lyra"></div>
</div>

<div class="hud" id="ann">GPS ACQ</div>

<div class="hud" id="legend" hidden>
  <div class="ttl" id="legt"></div>
  <div class="labels" id="legl"></div>
  <div class="bar" id="legb"></div>
</div>

<nav id="bar">
  <button id="b-radar" data-layer="radar" aria-pressed="false">RADAR</button>
  <button id="b-temp" data-layer="temp" aria-pressed="false">TEMP</button>
  <button id="b-wind" data-layer="wind" aria-pressed="false">VIENTO</button>
</nav>

<script>
"use strict";
/* ============================================================
   MeteoND — visor meteorológico track-up
   Fuentes: OpenTopoMap (base), RainViewer (radar), Open-Meteo (T y viento)
   ============================================================ */
const $ = s => document.querySelector(s);
const D2R = Math.PI / 180;
const OWN_Y = 0.80;                       // posición vertical del avión propio (fracción de alto)
let mapReady = false;
const SIM = new URLSearchParams(location.search).has("sim");

const store = {
  get(k, d) { try { const v = localStorage.getItem("meteond." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("meteond." + k, JSON.stringify(v)); } catch {} }
};

const st = {
  lat: store.get("lat", 40.4168), lon: store.get("lon", -3.7038),
  track: 0, gs: null, fix: false, last: null,
  layer: store.get("layer", "radar"),
  userZoom: false
};

/* ---------- utilidades geo ---------- */
function dist(a, b, c, d) {
  const R = 6371000, dLa = (c - a) * D2R, dLo = (d - b) * D2R;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a * D2R) * Math.cos(c * D2R) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function brg(a, b, c, d) {
  const y = Math.sin((d - b) * D2R) * Math.cos(c * D2R);
  const x = Math.cos(a * D2R) * Math.sin(c * D2R) - Math.sin(a * D2R) * Math.cos(c * D2R) * Math.cos((d - b) * D2R);
  return (Math.atan2(y, x) / D2R + 360) % 360;
}
const mpp = () => 40075016.686 * Math.cos(st.lat * D2R) / (512 * 2 ** map.getZoom()); // m por px CSS
const pad3 = n => String(Math.round(n) % 360).padStart(3, "0");
const zt = t => { const d = new Date(t); return String(d.getUTCHours()).padStart(2, "0") + String(d.getUTCMinutes()).padStart(2, "0") + "Z"; };

/* ---------- escalas de color (estilo Windy) ---------- */
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function ramp(stops) {
  const s = stops.map(([v, c]) => [v, hex(c)]);
  return v => {
    if (v <= s[0][0]) return s[0][1];
    for (let i = 1; i < s.length; i++) if (v <= s[i][0]) {
      const t = (v - s[i - 1][0]) / (s[i][0] - s[i - 1][0]), a = s[i - 1][1], b = s[i][1];
      return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
    }
    return s[s.length - 1][1];
  };
}
const TEMP_STOPS = [[-20,"#6a3d9a"],[-10,"#3c5fc4"],[0,"#3fa4d8"],[5,"#43c2a8"],[10,"#78c95a"],[15,"#c6d34a"],
                    [20,"#f1c33b"],[25,"#ee8a2e"],[30,"#df4a2a"],[35,"#b1203c"],[40,"#7a1032"]];
const WIND_STOPS = [[0,"#5a6ab2"],[10,"#3d8ec2"],[20,"#36a7a0"],[30,"#4dba58"],[45,"#c6c33d"],
                    [60,"#e39a33"],[80,"#d9462e"],[100,"#a3246e"],[130,"#6c2a8c"]];
const tempC = ramp(TEMP_STOPS), windC = ramp(WIND_STOPS);
/* Paleta Universal Blue de RainViewer (aproximada) */
const RADAR_CLASSES = [["#9ad7ec","Débil"],["#3c96d8","Moder."],["#1f55b0","Fuerte"],["#f3d23c","M.fuerte"],["#f08a26","Intensa"],["#e0332c","Extrema"]];

/* ---------- mapa ---------- */
const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      topo: {
        type: "raster", tileSize: 256, maxzoom: 17,
        tiles: ["a", "b", "c"].map(s => `https://${s}.tile.opentopomap.org/{z}/{x}/{y}.png`),
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'
      }
    },
    layers: [
      { id: "bg", type: "background", paint: { "background-color": "#04060b" } },
      { id: "topo", type: "raster", source: "topo",
        paint: { "raster-brightness-max": 0.68, "raster-saturation": -0.35, "raster-contrast": 0.05 } }
    ]
  },
  center: [st.lon, st.lat], zoom: store.get("zoom", 10), bearing: 0,
  minZoom: 5, maxZoom: 15,
  attributionControl: false, dragPan: false, dragRotate: false, keyboard: false,
  touchPitch: false, pitchWithRotate: false, boxZoom: false, doubleClickZoom: false,
  fadeDuration: 150
});
map.addControl(new maplibregl.AttributionControl({ compact: true,
  customAttribution: 'Meteo © <a href="https://open-meteo.com">Open-Meteo</a> (CC-BY 4.0)' }), "bottom-right");
map.touchZoomRotate.disableRotation();
map.touchZoomRotate.enable({ around: "center" });
map.scrollZoom.enable({ around: "center" });

function applyPadding() { map.setPadding({ top: Math.round(innerHeight * (2 * OWN_Y - 1)), bottom: 0, left: 0, right: 0 }); }
applyPadding();

map.on("zoomstart", e => { if (e.originalEvent) st.userZoom = true; });
map.on("zoomend", e => {
  if (st.userZoom) { st.userZoom = false; follow(400); }
  store.set("zoom", map.getZoom());
  drawRose(); checkGrid();
});
map.on("rotate", drawRoseRotation);
map.on("move", drawRoseRotation);

function follow(duration = 900) {
  if (st.userZoom) return;
  map.easeTo({ center: [st.lon, st.lat], bearing: st.track, duration, easing: t => t, essential: true });
}

/* ---------- rosa de rumbos y símbolo propio ---------- */
const SVGNS = "http://www.w3.org/2000/svg";
const rose = $("#rose");
let roseG, rangeT;
function el(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function geom() {
  const W = innerWidth, H = innerHeight, cx = W / 2, cy = H * OWN_Y;
  const R = Math.min(H * 0.52, W * 0.78);
  return { W, H, cx, cy, R };
}
function drawRose() {
  const { W, H, cx, cy, R } = geom();
  rose.setAttribute("viewBox", `0 0 ${W} ${H}`);
  rose.textContent = "";
  const ink = "#eef2f7";
  // anillo de alcance a R/2
  el("circle", { cx, cy, r: R / 2, fill: "none", stroke: ink, "stroke-opacity": .35, "stroke-width": 1.2, "stroke-dasharray": "3 9" }, rose);
  const km = mpp() * R / 2 / 1000;
  rangeT = el("text", { x: cx - R / 2 * 0.71 - 6, y: cy - R / 2 * 0.71 - 4, fill: ink, "font-size": 14, "text-anchor": "end",
                        "font-family": "B612 Mono, monospace", style: "paint-order:stroke;stroke:#000;stroke-width:3px" }, rose);
  rangeT.textContent = km >= 10 ? Math.round(km) : km.toFixed(1);

  roseG = el("g", {}, rose);
  el("circle", { cx, cy, r: R, fill: "none", stroke: ink, "stroke-width": 1.6 }, roseG);
  for (let a = 0; a < 360; a += 5) {
    const long = a % 10 === 0, len = long ? 13 : 7;
    const s = Math.sin(a * D2R), c = Math.cos(a * D2R);
    el("line", { x1: cx + s * R, y1: cy - c * R, x2: cx + s * (R - len), y2: cy - c * (R - len), stroke: ink, "stroke-width": long ? 1.6 : 1.1 }, roseG);
    if (a % 30 === 0) {
      const t = el("text", { x: cx, y: cy - R + 30, fill: ink, "font-size": 17, "text-anchor": "middle",
        "font-family": "B612 Mono, monospace", transform: `rotate(${a} ${cx} ${cy})`,
        style: "paint-order:stroke;stroke:#000;stroke-width:3px" }, roseG);
      t.textContent = String(a / 10);
    }
  }
  // índice fijo de track en la parte superior del arco
  el("path", { d: `M${cx - 9} ${cy - R - 13} L${cx + 9} ${cy - R - 13} L${cx} ${cy - R - 1} Z`, fill: "none", stroke: ink, "stroke-width": 1.8 }, rose);
  // línea de track (magenta) hasta el arco
  el("line", { x1: cx, y1: cy - 22, x2: cx, y2: cy - R, stroke: "#ff62d4", "stroke-width": 1.4, "stroke-opacity": .7 }, rose);
  // avión propio
  el("path", { d: `M${cx} ${cy - 20} L${cx + 13} ${cy + 16} L${cx - 13} ${cy + 16} Z`, fill: "none", stroke: ink, "stroke-width": 2.4, "stroke-linejoin": "round" }, rose);
  el("line", { x1: cx, y1: cy - 20, x2: cx, y2: cy + 16, stroke: ink, "stroke-width": 1.4 }, rose);
  // leyenda justo por debajo del corte del arco con el borde derecho
  const yCut = R > W / 2 ? cy - Math.sqrt(R * R - (W / 2) ** 2) : cy - R;
  $("#legend").style.top = Math.min(Math.max(yCut + 14, H * 0.3), H - 260) + "px";
  drawRoseRotation();
}
function drawRoseRotation() {
  if (!roseG) return;
  const { cx, cy } = geom();
  roseG.setAttribute("transform", `rotate(${-map.getBearing()} ${cx} ${cy})`);
}

/* ---------- HUD ---------- */
function updateHud() {
  $("#trkv").textContent = st.fix ? pad3(st.track) : "---";
  $("#gs").textContent = st.gs == null ? "---" : String(Math.round(st.gs * 3.6)).padStart(3, " ");
  const ann = $("#ann");
  if (!st.fix) { ann.hidden = false; }
  else ann.hidden = true;

  const g = grid && valueAt(st.lat, st.lon);
  const showW = !!g && st.layer !== "radar";
  $("#windrow").hidden = !showW;
  $("#satrow").hidden = !showW;
  if (showW) {
    const spd = Math.hypot(g.u, g.v);
    const from = (Math.atan2(-g.u, -g.v) / D2R + 360) % 360;
    $("#wnd").textContent = `${pad3(from)}°/${Math.round(spd)}`;
    // la flecha apunta hacia donde sopla, relativa a la pantalla (track-up)
    $("#windarrow").style.transform = `rotate(${from + 180 - st.track}deg)`;
    $("#sat").textContent = (g.t >= 0 ? "+" : "") + g.t.toFixed(0);
  }
  updateLayerInfo();
}
function updateLayerInfo() {
  const now = Date.now();
  let name = "—", t = null;
  if (st.layer === "radar") { name = "RADAR"; t = radar.time ? radar.time * 1000 : null; }
  if (st.layer === "temp") { name = "TEMP 2M"; t = grid && grid.time; }
  if (st.layer === "wind") { name = "VIENTO 10M"; t = grid && grid.time; }
  $("#lyr").textContent = st.layer ? name : "SIN CAPA";
  $("#lyrt").textContent = t ? zt(t) : (st.layer ? "CARGANDO" : "");
  const age = t ? Math.round((now - t) / 60000) : null;
  const a = $("#lyra");
  a.textContent = age != null ? `HACE ${age} MIN` : "";
  a.className = "age " + (age != null && age > (st.layer === "radar" ? 25 : 75) ? "a" : "c");
}

/* ---------- GPS ---------- */
function onPos(p) {
  const { latitude: lat, longitude: lon, heading, speed } = p.coords;
  let gs = speed != null && !isNaN(speed) ? speed : null;
  let trk = heading != null && !isNaN(heading) && (gs == null || gs > 0.8) ? heading : null;
  const prev = st.last;
  if (prev) {
    const d = dist(prev.lat, prev.lon, lat, lon), dt = (p.timestamp - prev.t) / 1000;
    if (gs == null && dt > 0) gs = d / dt;
    if (trk == null && d > 12 && (gs == null || gs > 0.8)) trk = brg(prev.lat, prev.lon, lat, lon);
  }
  if (!prev || dist(prev.lat, prev.lon, lat, lon) > 12) st.last = { lat, lon, t: p.timestamp };
  if (trk != null) st.track = trk;
  st.gs = gs; st.lat = lat; st.lon = lon;
  if (!st.fix) { st.fix = true; follow(0); } else follow();
  store.set("lat", lat); store.set("lon", lon);
  updateHud(); checkGrid();
}
function onPosErr(e) {
  st.fix = false;
  $("#ann").textContent = e.code === 1 ? "GPS DENEGADO" : "GPS NO DISP";
  updateHud();
}
function startGps() {
  if (SIM) return startSim();
  if (!("geolocation" in navigator)) return onPosErr({ code: 2 });
  navigator.geolocation.watchPosition(onPos, onPosErr, { enableHighAccuracy: true, maximumAge: 1000, timeout: 30000 });
}
/* Modo simulación (?sim): recorrido a 90 km/h con giros suaves */
function startSim() {
  let lat = st.lat, lon = st.lon, h = 20, t0 = Date.now();
  $("#ann").textContent = "SIM";
  setInterval(() => {
    const t = (Date.now() - t0) / 1000, v = 25;
    h = (h + 2.2 * Math.sin(t / 25) + 360) % 360;
    lat += v * Math.cos(h * D2R) / 111320;
    lon += v * Math.sin(h * D2R) / (111320 * Math.cos(lat * D2R));
    onPos({ coords: { latitude: lat, longitude: lon, heading: h, speed: v }, timestamp: Date.now() });
    $("#ann").hidden = false; $("#ann").textContent = "SIM";
  }, 1000);
}

/* ---------- capa RADAR (RainViewer) ---------- */
const radar = { host: null, path: null, time: null, timer: null };
async function pollRadar() {
  try {
    const r = await fetch("https://api.rainviewer.com/public/weather-maps.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const past = j.radar && j.radar.past;
    if (!past || !past.length) throw new Error("sin fotogramas");
    const f = past[past.length - 1];
    if (f.path !== radar.path) {
      Object.assign(radar, { host: j.host, path: f.path, time: f.time });
      setRadarSource();
    }
  } catch (e) { console.warn("radar", e); }
  updateLayerInfo();
}
function setRadarSource() {
  if (!mapReady || !radar.path) return;
  if (map.getLayer("radar")) map.removeLayer("radar");
  if (map.getSource("radar")) map.removeSource("radar");
  map.addSource("radar", {
    type: "raster", tileSize: 256, maxzoom: 7,
    tiles: [`${radar.host}${radar.path}/256/{z}/{x}/{y}/2/1_1.png`],
    attribution: 'Radar © <a href="https://www.rainviewer.com">RainViewer</a>'
  });
  map.addLayer({ id: "radar", type: "raster", source: "radar",
    paint: { "raster-opacity": 0.78, "raster-resampling": "linear", "raster-fade-duration": 0 },
    layout: { visibility: st.layer === "radar" ? "visible" : "none" } });
}

/* ---------- capas TEMP y VIENTO (Open-Meteo, rejilla 9×9) ---------- */
const N = 9;
let grid = null, gridBusy = false, gridRetry = 0;
function neededHalf() {
  const m = innerHeight * OWN_Y * mpp() * 1.15;
  return Math.min(3, Math.max(0.35, m / 111320));
}
function nextQuarter() {
  const d = new Date(); d.setUTCSeconds(0, 0);
  d.setUTCMinutes(Math.floor(d.getUTCMinutes() / 15) * 15 + 15 + 3);
  return d.getTime();
}
function checkGrid(force) {
  if (st.layer !== "temp" && st.layer !== "wind") return;
  if (gridBusy || Date.now() < gridRetry) return;
  const need = neededHalf();
  if (force || !grid || Date.now() > grid.nextAt ||
      Math.abs(st.lat - grid.cLat) > grid.half * 0.4 ||
      Math.abs(st.lon - grid.cLon) > grid.halfLon * 0.4 ||
      need > grid.half * 1.25 || need < grid.half * 0.5) fetchGrid(need);
}
async function fetchGrid(half) {
  gridBusy = true;
  const cLat = st.lat, cLon = st.lon, halfLon = half / Math.cos(cLat * D2R);
  const la = [], lo = [];
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {      // i: fila desde el sur
    la.push((cLat - half + 2 * half * i / (N - 1)).toFixed(3));
    lo.push((cLon - halfLon + 2 * halfLon * j / (N - 1)).toFixed(3));
  }
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + la.join(",") + "&longitude=" + lo.join(",") +
              "&current=temperature_2m,wind_speed_10m,wind_direction_10m&wind_speed_unit=kmh&timezone=GMT";
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    let j = await r.json(); if (!Array.isArray(j)) j = [j];
    const T = [], U = [], V = [];
    j.forEach(o => {
      const c = o.current, s = c.wind_speed_10m, d = c.wind_direction_10m * D2R;
      T.push(c.temperature_2m); U.push(-s * Math.sin(d)); V.push(-s * Math.cos(d));
    });
    grid = { cLat, cLon, half, halfLon, T, U, V,
             s: cLat - half, n: cLat + half, w: cLon - halfLon, e: cLon + halfLon,
             time: Date.parse(j[0].current.time + "Z"), nextAt: nextQuarter() };
    renderField();
    resetParticles();
  } catch (e) {
    console.warn("open-meteo", e);
    gridRetry = Date.now() + 60000;
  }
  gridBusy = false;
  updateHud();
}
function sample(arr, gx, gy) {
  const x0 = Math.min(N - 2, Math.floor(gx)), y0 = Math.min(N - 2, Math.floor(gy));
  const fx = gx - x0, fy = gy - y0, k = y0 * N + x0;
  return (arr[k] * (1 - fx) + arr[k + 1] * fx) * (1 - fy) + (arr[k + N] * (1 - fx) + arr[k + N + 1] * fx) * fy;
}
function valueAt(lat, lon) {
  if (!grid || lat < grid.s || lat > grid.n || lon < grid.w || lon > grid.e) return null;
  const gx = (lon - grid.w) / (grid.e - grid.w) * (N - 1), gy = (lat - grid.s) / (grid.n - grid.s) * (N - 1);
  return { t: sample(grid.T, gx, gy), u: sample(grid.U, gx, gy), v: sample(grid.V, gx, gy) };
}
const fieldCanvas = document.createElement("canvas");
function renderField() {
  if (!grid || !mapReady) return;
  const S = 192; fieldCanvas.width = fieldCanvas.height = S;
  const ctx = fieldCanvas.getContext("2d"), img = ctx.createImageData(S, S);
  const isT = st.layer !== "wind";
  for (let py = 0; py < S; py++) {
    const gy = (1 - py / (S - 1)) * (N - 1);
    for (let px = 0; px < S; px++) {
      const gx = px / (S - 1) * (N - 1);
      const c = isT ? tempC(sample(grid.T, gx, gy)) : windC(Math.hypot(sample(grid.U, gx, gy), sample(grid.V, gx, gy)));
      const o = (py * S + px) * 4;
      img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const url = fieldCanvas.toDataURL("image/png");
  const coords = [[grid.w, grid.n], [grid.e, grid.n], [grid.e, grid.s], [grid.w, grid.s]];
  const src = map.getSource("field");
  if (src) src.updateImage({ url, coordinates: coords });
  else {
    map.addSource("field", { type: "image", url, coordinates: coords });
    map.addLayer({ id: "field", type: "raster", source: "field",
      paint: { "raster-opacity": 0.55, "raster-resampling": "linear", "raster-fade-duration": 0 } });
  }
  map.setPaintProperty("field", "raster-opacity", isT ? 0.55 : 0.45);
  map.setLayoutProperty("field", "visibility", st.layer === "temp" || st.layer === "wind" ? "visible" : "none");
}

/* ---------- partículas de viento ---------- */
const wc = $("#wind"), wctx = wc.getContext("2d");
let DPR = 1, particles = [];
const TRAIL = 8;
function sizeCanvas() {
  DPR = Math.min(2, devicePixelRatio || 1);
  wc.width = innerWidth * DPR; wc.height = innerHeight * DPR;
  wc.style.width = innerWidth + "px"; wc.style.height = innerHeight + "px";
}
function spawn(p) {
  const b = map.getBounds();
  const w = Math.max(b.getWest(), grid.w), e = Math.min(b.getEast(), grid.e);
  const s = Math.max(b.getSouth(), grid.s), n = Math.min(b.getNorth(), grid.n);
  const ok = w < e && s < n;
  p.lon = ok ? w + Math.random() * (e - w) : grid.w + Math.random() * (grid.e - grid.w);
  p.lat = ok ? s + Math.random() * (n - s) : grid.s + Math.random() * (grid.n - grid.s);
  p.age = 0; p.max = 50 + Math.random() * 70; p.h = [[p.lon, p.lat]];
}
function resetParticles() {
  if (!grid) return;
  const n = Math.max(250, Math.min(900, Math.round(innerWidth * innerHeight / 380)));
  particles = Array.from({ length: n }, () => { const p = {}; spawn(p); p.age = Math.random() * p.max; return p; });
}
function frame() {
  requestAnimationFrame(frame);
  if (document.hidden) return;
  wctx.setTransform(1, 0, 0, 1, 0, 0);
  wctx.clearRect(0, 0, wc.width, wc.height);
  if (st.layer !== "wind" || !grid || !particles.length) return;
  const k = 0.05 * mpp();          // metros por frame por cada km/h
  const proj = [];
  for (const p of particles) {
    const v = valueAt(p.lat, p.lon);
    if (!v || p.age > p.max) { spawn(p); continue; }
    p.lat += v.v * k / 111320;
    p.lon += v.u * k / (111320 * Math.cos(p.lat * D2R));
    p.h.push([p.lon, p.lat]); if (p.h.length > TRAIL) p.h.shift();
    p.age++;
  }
  for (const p of particles) proj.push(p.h.map(c => map.project(c)));
  wctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  wctx.lineWidth = 1.4; wctx.lineCap = "round";
  for (let s = 1; s < TRAIL; s++) {
    wctx.strokeStyle = `rgba(255,255,255,${(s / TRAIL * 0.85).toFixed(3)})`;
    wctx.beginPath();
    for (const pts of proj) if (pts.length > s) { wctx.moveTo(pts[s - 1].x, pts[s - 1].y); wctx.lineTo(pts[s].x, pts[s].y); }
    wctx.stroke();
  }
}

/* ---------- leyenda ---------- */
function drawLegend() {
  const L = $("#legend"), lb = $("#legb"), ll = $("#legl"), lt = $("#legt");
  if (!st.layer) { L.hidden = true; return; }
  L.hidden = false; ll.textContent = "";
  let labels, bg, ttl;
  if (st.layer === "radar") {
    ttl = "PRECIP";
    const n = RADAR_CLASSES.length;
    bg = "linear-gradient(to top," + RADAR_CLASSES.map(([c], i) => `${c} ${i / n * 100}% ${(i + 1) / n * 100}%`).join(",") + ")";
    labels = RADAR_CLASSES.map(c => c[1]).reverse();
  } else {
    const stops = st.layer === "temp" ? TEMP_STOPS.filter((_, i) => i % 2 === 0) : WIND_STOPS.filter((_, i) => i !== 1 && i !== 3);
    const all = st.layer === "temp" ? TEMP_STOPS : WIND_STOPS;
    const lo = all[0][0], hi = all[all.length - 1][0];
    ttl = st.layer === "temp" ? "°C" : "KM/H";
    bg = "linear-gradient(to top," + all.map(([v, c]) => `${c} ${((v - lo) / (hi - lo) * 100).toFixed(1)}%`).join(",") + ")";
    labels = stops.map(s => s[0]).reverse();
  }
  lt.textContent = ttl;
  lb.style.background = bg;
  L.style.height = st.layer === "radar" ? "150px" : "170px";
  for (const t of labels) { const d = document.createElement("div"); d.textContent = t; ll.appendChild(d); }
}

/* ---------- selección de capa ---------- */
function setLayer(l) {
  st.layer = l; store.set("layer", l);
  document.querySelectorAll("#bar button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.layer === l)));
  if (map.getLayer("radar")) map.setLayoutProperty("radar", "visibility", l === "radar" ? "visible" : "none");
  if (map.getLayer("field")) map.setLayoutProperty("field", "visibility", l === "temp" || l === "wind" ? "visible" : "none");
  clearInterval(radar.timer);
  if (l === "radar") { pollRadar(); radar.timer = setInterval(pollRadar, 120000); }
  if (l === "temp" || l === "wind") { if (grid) renderField(); checkGrid(); }
  if (l === "wind") resetParticles();
  drawLegend(); updateHud();
}
document.querySelectorAll("#bar button").forEach(b =>
  b.addEventListener("click", () => setLayer(st.layer === b.dataset.layer ? null : b.dataset.layer)));

/* ---------- pantalla siempre encendida ---------- */
let wakeLock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && !wakeLock && !document.hidden) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); } } catch {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { keepAwake(); checkGrid(); if (st.layer === "radar") pollRadar(); } });
document.addEventListener("pointerdown", keepAwake, { once: true });

/* ---------- arranque ---------- */
addEventListener("resize", () => { applyPadding(); sizeCanvas(); drawRose(); follow(0); });
map.on("load", () => {
  mapReady = true;
  sizeCanvas(); drawRose(); setLayer(st.layer); startGps(); keepAwake();
  requestAnimationFrame(frame);
  setInterval(() => { checkGrid(); updateLayerInfo(); }, 30000);
});
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
